map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 8080;
	server_name _;
	server_tokens off;
	# Container listens on 8080 but is published as host:3001.
	port_in_redirect off;
	absolute_redirect off;
	root /usr/share/nginx/html;
	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 256;

	# Same-origin API proxy → staging rportd in this compose network (HTTP :3002).
	# Prod rportd on :443/:853 is left untouched; agents stay on prod.
	location /api/ {
		proxy_pass http://rportd:3002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Authorization $http_authorization;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_buffering off;
	}

	location / {
		try_files $uri $uri/ /200.html /index.html;
	}
}
